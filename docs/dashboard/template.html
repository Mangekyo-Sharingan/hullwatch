<script>
"use strict";
const D=JSON.parse(document.getElementById('dashboard-data').textContent);
const DOCS=new Map(D.documents.map(d=>[d.path,d]));
const MEDIA=new Map(D.media.map(m=>[m.path,m]));
const LABELS={complete:'Complete',in_progress:'In progress',needs_review:'Review pending',planned:'Planned',blocked:'Blocked'};
const VIEWS={overview:'Development overview',roadmap:'Production roadmap',library:'Documentation library',gallery:'Visual archive',activity:'Project history',graph:'Knowledge graph'};
const ICONS={overview:'M3 3h6v6H3zM12 3h6v6h-6zM3 12h6v6H3zM12 12h6v6h-6z',roadmap:'M3 4h14M3 10h14M3 16h14M6 2v4M13 8v4M9 14v4',library:'M4 2h10l3 3v13H4zM12 2v4h4M7 9h6M7 12h6',gallery:'M2 3h16v14H2zM3 15l5-6 4 4 3-3 3 5M13 7h.01',activity:'M3 3v15h15M5 12l4-5 4 3 4-6',graph:'M3 3h5v5H3zM13 3h5v5h-5zM8 13h5v5H8zM5.5 8v2.5h10V8M10.5 10.5V13'};
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>new Date(x).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
const short=x=>String(x).replace(/\*\*/g,'').replace(/`/g,'');
const route=(view,extra={})=>'#'+new URLSearchParams({view,...extra}).toString();
const docRoute=path=>route('library',{doc:path});
const chip=status=>`<span class="chip ${E(status)}">${E(LABELS[status]||status)}</span>`;
const documentLink=(path,label)=>DOCS.has(path)?`<a href="${E(docRoute(path))}">${E(label||DOCS.get(path).title)}</a>`:`<span class="muted" title="${E(path)}">${E(label||path)}</span>`;
const evidence=items=>`<div class="evidence">${(items||[]).map(e=>documentLink(e.path,e.label)).join('')}</div>`;
const IDS=new Map();
(D.roadmap.release_path?.stages||[]).forEach(s=>IDS.set(s.id,{kind:'stage',item:s}));
D.roadmap.milestones.forEach(m=>{IDS.set(m.id,{kind:'milestone',item:m});(m.tasks||[]).forEach(t=>IDS.set(t.id,{kind:'task',item:t,parent:m}))});
D.roadmap.gates.forEach(g=>IDS.set(g.id,{kind:'gate',item:g}));
const idTag=id=>`<button type="button" class="tag id-tag" data-copy-id="${E(id)}" title="Copy roadmap ID ${E(id)}">${E(id)}</button>`;
const current=()=>{const p=new URLSearchParams(location.hash.slice(1));const hit=IDS.get((p.get('id')||'').toUpperCase());if(hit?.kind==='task'){p.set('milestone',hit.parent.id);p.set('task',hit.item.id)}else if(hit&&!p.has(hit.kind))p.set(hit.kind,hit.item.id);return p};
let activeDoc='';let raw=false;let tocItems=[];let headingCounts={};
function resolveTarget(href,path){
 if(!href)return null;
 href=href.replace(/\\/g,'/');
 if(/^(https?:|mailto:)/i.test(href))return {url:href,external:true};
 if(/^[a-z][a-z0-9+.-]*:/i.test(href))return null;
 if(href.startsWith('#'))return {url:route('library',{doc:path,heading:decodeURIComponent(href.slice(1))})};
 if(href.startsWith('/home/')||href.startsWith('/tmp/')){
   const absolute=href.split(/:\d+$/)[0];
   const match=absolute.match(/OperationSpacer\/(.+)$/);
   if(match&&DOCS.has(match[1]))return {url:docRoute(match[1])};
   if(location.protocol==='file:')return {url:'file://'+absolute,external:true};
   return null;
 }
 try{
   const target=new URL(href,'https://repository.invalid/'+path);
   const rel=decodeURIComponent(target.pathname.slice(1));
   if(rel==='docs/dashboard/index.html')return {url:route('overview')};
   if(DOCS.has(rel))return {url:route('library',{doc:rel,...(target.hash?{heading:decodeURIComponent(target.hash.slice(1))}:{})})};
   if(MEDIA.has(rel))return {url:MEDIA.get(rel).url,media:rel};
   return null;
 }catch{return null}
}
marked.use({gfm:true,renderer:{
 html({text}){return E(text)},
 heading({tokens,depth}){const html=this.parser.parseInline(tokens);const plain=html.replace(/<[^>]*>/g,'').replace(/&[^;]+;/g,'');let id=plain.toLowerCase().replace(/[^\p{L}\p{N} _-]/gu,'').trim().replace(/\s+/g,'-');const count=headingCounts[id]||0;headingCounts[id]=count+1;if(count)id+='-'+count;if(depth<=3)tocItems.push({id,text:plain,depth});return `<h${depth} id="${E(id)}">${html}</h${depth}>`},
 link({href,title,tokens}){const text=this.parser.parseInline(tokens);const target=resolveTarget(href,activeDoc);if(!target)return `<span class="unavailable" title="Source reference: ${E(href)}">${text}</span>`;return `<a href="${E(target.url)}"${target.external?' target="_blank" rel="noopener noreferrer"':''}${target.media?` data-image="${E(target.media)}"`:''}${title?` title="${E(title)}"`:''}>${text}</a>`},
 image({href,title,text}){const target=resolveTarget(href,activeDoc);if(!target||!target.media)return `<span class="unavailable">Image reference: ${E(text||href)}</span>`;return `<img loading="lazy" src="${E(target.url)}" alt="${E(text)}" title="${E(title||text)}" data-image="${E(target.media)}">`}
}});
function markdown(doc){activeDoc=doc.path;tocItems=[];headingCounts={};return doc.format==='md'?marked.parse(doc.content):`<pre>${E(doc.content)}</pre>`}
function headline(label,title,description,extra=''){return `<div class="page-heading"><div><div class="eyebrow">${E(label)}</div><h1>${E(title)}</h1><p>${E(description)}</p></div>${extra}</div>`}
function counts(items){return Object.fromEntries(Object.keys(LABELS).map(s=>[s,items.filter(i=>i.status===s).length]))}
function recentDocs(){return D.documents.filter(d=>d.format==='md'&&((d.path.startsWith('docs/design/')&&/result|pass\.md|review\.md/.test(d.path))||d.path==='docs/dashboard/RESULT.md')).sort((a,b)=>b.modified.localeCompare(a.modified))}
function renderReleasePath(params){
 const path=D.roadmap.release_path;if(!path?.stages?.length)return '';
 const stage=path.stages.find(s=>s.id===params.get('stage'))||path.stages.find(s=>s.id===path.current_stage)||path.stages[0];
 const view=params.get('view')==='roadmap'?'roadmap':'overview';
 const milestones=stage.milestones.map(id=>D.roadmap.milestones.find(m=>m.id===id)).filter(Boolean);
 const gates=stage.gates.map(id=>D.roadmap.gates.find(g=>g.id===id)).filter(Boolean);
 return `<section class="release-path" aria-label="Roadmap to Early Access"><div class="panel-heading"><div><div class="eyebrow">Development journey</div><h2>From foundation to Early Access</h2></div><span class="tag">${path.stages.length} stages</span></div><p class="section-caption">Select a stage to see its exit criteria and linked work. Stage status records implementation and acceptance; task totals do not measure release readiness.</p><ol class="release-stages">${path.stages.map((s,i)=>`<li><a class="stage-card ${E(s.status)}" href="${route(view,{stage:s.id})}" data-stage="${E(s.id)}"${s.id===stage.id?' aria-current="step"':''}><span class="stage-marker ${s.id===path.current_stage?'stage-current':''}">${s.id===path.current_stage?'You are here':'Stage '+(i+1)}</span><strong>${E(s.title)}</strong><span class="stage-id">${E(s.id)}</span>${chip(s.status)}</a></li>`).join('')}</ol><div class="stage-detail" id="stage-detail" data-roadmap-id="${E(stage.id)}"><div class="eyebrow">Selected stage${stage.id===path.current_stage?' · current work':''}</div><div class="detail-id">${idTag(stage.id)}</div><h3>${E(stage.title)}</h3><p class="detail-summary">${E(stage.summary)}</p><div class="stage-details-grid"><div><div class="eyebrow">Exit criteria</div><ul class="acceptance">${stage.exit_criteria.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div><div class="eyebrow">Milestones</div><div class="stage-links">${milestones.map(m=>`<a class="button" href="${route('roadmap',{milestone:m.id})}">${E(m.id)} · ${E(m.title)} ↗</a>`).join('')||'<small>No additional milestones</small>'}</div><div class="eyebrow">Acceptance gates</div><div class="stage-links">${gates.map(g=>`<a class="button" href="${route('roadmap',{gate:g.id})}">${E(g.id)} · ${E(g.title)} ↗</a>`).join('')||'<small>See milestone acceptance evidence</small>'}</div></div></div></div></section>`;
}
function renderPlan(){
 const plan=D.roadmap.ea_plan;if(!plan)return '';
 const slices=plan.slices.map(id=>IDS.get(id).item),accepted=slices.filter(s=>s.status==='complete').length,active=slices.find(s=>!['complete','blocked'].includes(s.status));
 return `<section class="ea-plan" aria-label="Early Access build plan"><div class="panel-heading"><div><div class="eyebrow">Early Access build plan · decided ${E(plan.decided)} · one slice at a time</div><h2>${accepted} of ${slices.length} slices accepted</h2></div>${documentLink('AGENTS.md','Build rules ↗')}</div><p class="section-caption">${E(plan.summary)}</p>`+
 (active?`<div class="ea-active" data-roadmap-id="${E(active.id)}"><div class="eyebrow">${active.status==='planned'?'Next slice':'Active slice'} · ${slices.indexOf(active)+1} of ${slices.length}</div><div class="ea-active-head">${idTag(active.id)}${chip(active.status)}<h3><a href="${route('roadmap',{milestone:active.id})}">${E(active.title)} ↗</a></h3></div><div class="ea-outcome"><strong>Player outcome</strong><p>${E(active.player_outcome)}</p></div><div class="ea-outcome"><strong>Proof required</strong><p>${E(active.proof)}</p></div></div>`:'')+
 `<ol class="ea-slices">${slices.map(s=>`<li class="ea-slice ${E(s.status)}${s===active?' ea-current':''}">${idTag(s.id)}<a href="${route('roadmap',{milestone:s.id})}">${E(s.title)}</a>${chip(s.status)}</li>`).join('')}</ol>`+
 `<details class="ea-notnow"><summary>Not now — ${plan.not_now.length} things that wait until after Early Access</summary><ul>${plan.not_now.map(x=>`<li>${E(x)}</li>`).join('')}</ul><div class="eyebrow">Operator decisions ${E(plan.decided)}</div><ul>${plan.decisions.map(x=>`<li>${E(x)}</li>`).join('')}</ul></details></section>`;
}
function renderOverview(params){
 const plan=D.roadmap.ea_plan||{slices:[]},history=D.roadmap.milestones.filter(m=>!plan.slices.includes(m.id)),states=counts(history),planDone=plan.slices.filter(id=>IDS.get(id)?.item.status==='complete').length,tasks=D.roadmap.milestones.flatMap(m=>m.tasks||[]),review=D.roadmap.gates.filter(g=>g.status!=='complete');
 const image=D.media.find(m=>/step09.*seated.*\.png$/.test(m.path))||D.media.find(m=>/cockpit.*\.png$/.test(m.path))||D.media[0];
 const checkpoint=D.roadmap.checkpoint||{};const source=checkpoint.source||{};
 return headline('Production desk','A ship. A long way to go.','A living archive of Hullwatch’s design, development passes, and evidence.',`<span class="tag">${E(D.repository.branch||'Local workspace')}</span>`)+renderPlan()+
 renderReleasePath(params)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">First-person ship maintenance / Grounded dread</div><h2>Keep the vessel.<br>Keep yourself.</h2><p>Inspect, diagnose, repair, and triage a decaying long-haul ship. The work is the gameplay. The horror is entropy.</p><div class="hero-actions"><a class="button" href="${route('roadmap')}">Explore the roadmap ↗</a><a class="button" href="${docRoute('docs/PRODUCTION_SPEC.md')}">Read the production spec</a></div></div><div class="hero-photo">${image?`<img src="${E(image.url)}" alt="Hullwatch ship interior"><small>Captured in-game · ${E(image.title)}</small>`:''}</div></section>`+
 `<section class="stats" aria-label="Project totals"><div class="stat"><div class="eyebrow">EA slices accepted</div><strong>${planDone} / ${plan.slices.length}</strong><small>${states.complete} / ${history.length} earlier milestones closed · ${tasks.length} tasks tracked</small></div><div class="stat"><div class="eyebrow">Documentation</div><strong>${D.documents.length}</strong><small>Complete source documents & game data</small></div><div class="stat"><div class="eyebrow">Visual archive</div><strong>${D.media.length}</strong><small>Rendered captures, diagrams, and store art</small></div><div class="stat recorded"><div class="eyebrow">Recorded source validation</div><strong>${E(source.label||'See evidence')}</strong>${evidence(source.evidence)}</div></section>`+
 `<div class="grid-two"><section class="panel"><div class="panel-heading"><h2>Current checkpoint</h2>${documentLink('.wolf/STATUS.md','Full handoff ↗')}</div><div class="eyebrow">Current source / local work</div><div class="current-status"><p>${E(checkpoint.summary||D.roadmap.summary)}</p><p>${E(source.summary)}</p>${evidence(source.evidence)}</div><div class="toolbar"><span class="tag">HEAD ${E(D.repository.head||'unavailable')}</span><span class="tag">${D.repository.changes.length} working-tree entries</span></div><small>Recorded evidence keeps its execution date. Refreshing this page does not rerun game validation.</small><h3 class="section-gap">Delivered playtests</h3>${(checkpoint.delivered||[]).map(b=>`<div class="delivered-build"><div class="eyebrow">${E(b.platform)}</div><strong>${E(b.tag)}</strong><p>${E(b.source)}</p>${evidence(b.evidence)}</div>`).join('')||'<small>No delivered build recorded</small>'}</section><section class="panel"><div class="panel-heading"><h2>Next gates to close</h2><a class="text-link" href="${route('roadmap',{gates:'1'})}">All gates ↗</a></div>${review.slice(0,3).map(g=>`<div class="gate-row">${chip(g.status)}${idTag(g.id)}<h3><a href="${route('roadmap',{gate:g.id})}">${E(g.title)} ↗</a></h3><p>${E(g.summary)}</p>${evidence(g.evidence)}</div>`).join('')}</section></div>`+
 `<div class="grid-two section-gap"><section class="panel"><div class="panel-heading"><h2>Latest documented passes</h2><a class="text-link" href="${route('activity')}">History ↗</a></div>${recentDocs().slice(0,5).map(d=>`<a class="document-row" href="${docRoute(d.path)}"><strong>${E(d.title)}</strong><small>${E(d.category)} · source edited ${date(d.modified)}</small></a>`).join('')}</section><section class="panel"><div class="panel-heading"><h2>The source shelf</h2><a class="text-link" href="${route('library')}">Browse everything ↗</a></div>${['docs/PRODUCTION_SPEC.md','docs/EXPANSION_SPEC.md','docs/OPEN_QUESTIONS.md','docs/design/art_pass/README.md','docs/SHIPPING_CHECKLIST.md'].filter(p=>DOCS.has(p)).map(p=>`<a class="document-row" href="${docRoute(p)}"><strong>${E(DOCS.get(p).title)}</strong><small>${E(p)}</small></a>`).join('')}</section></div>`;
}
function renderRoadmap(params){
 const selected=D.roadmap.milestones.find(m=>m.id===params.get('milestone'));
 if(selected){const home=(D.roadmap.release_path?.stages||[]).find(s=>s.milestones.includes(selected.id));const target=selected.absorbed_into?IDS.get(selected.absorbed_into)?.item:null;const folded=D.roadmap.milestones.filter(m=>m.absorbed_into===selected.id);const slicePanel=selected.player_outcome?`<section class="panel ea-detail"><div class="ea-outcome"><strong>Player outcome</strong><p>${E(selected.player_outcome)}</p></div><div class="ea-outcome"><strong>Proof required</strong><p>${E(selected.proof)}</p></div>${selected.out_of_scope?.length?`<div class="eyebrow">Out of scope</div><ul class="acceptance">${selected.out_of_scope.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:''}${selected.gates?.length?`<div class="eyebrow section-gap">Closes gates</div><div class="stage-links">${selected.gates.map(g=>`<a class="button" href="${route('roadmap',{gate:g})}">${E(g)} ↗</a>`).join('')}</div>`:''}${folded.length?`<div class="eyebrow">Absorbs earlier milestones</div><div class="stage-links">${folded.map(m=>`<a class="button" href="${route('roadmap',{milestone:m.id})}">${E(m.id)} · ${E(m.title)} ↗</a>`).join('')}</div>`:''}</section>`:'';return `<div class="toolbar"><a class="button" href="${route('roadmap')}">← Full roadmap</a>${home?`<a class="button" href="${route('roadmap',{stage:home.id})}">${E(home.id)} · ${E(home.title)} ↗</a>`:''}</div>`+headline(selected.phase,selected.title,selected.summary,chip(selected.status))+(target?`<div class="absorbed-note">Open work moved into <a href="${route('roadmap',{milestone:target.id})}">${E(target.id)} · ${E(target.title)} ↗</a> by the EA build plan. This record is kept as history.</div>`:'')+slicePanel+`<section class="panel"><div class="detail-top">${idTag(selected.id)}<div class="toolbar">${evidence(selected.evidence)}</div><p class="section-caption">Evidence describes recorded work. An implementation checkpoint and a release acceptance are separate states.</p></div><div>${(selected.tasks||[]).map(t=>`<div class="task-row${params.get('task')===t.id?' task-selected':''}" data-roadmap-id="${E(t.id)}">${idTag(t.id)}${chip(t.status)}<div class="task-copy">${E(t.title)}${evidence(t.evidence)}</div></div>`).join('')}</div>${selected.acceptance?.length?`<h2 class="section-gap">Acceptance criteria</h2><ul class="acceptance">${selected.acceptance.map(a=>`<li>${E(a)}</li>`).join('')}</ul>`:''}</section>`}
 const filter=params.get('status')||'all';const items=D.roadmap.milestones.filter(m=>filter==='all'||m.status===filter);const phases=[...new Set(items.map(m=>m.phase))];
 let html=headline('Production map','From first playable to release.','The original production plan, expansions, later development passes, and the acceptance gates still ahead.',`<span class="tag">Roadmap recorded ${E(D.roadmap.updated)}</span>`);
 if(params.get('id')&&!IDS.has(params.get('id').toUpperCase()))html+=`<div class="id-missing" role="alert">No roadmap item has the ID <code>${E(params.get('id'))}</code>. IDs are listed on every card and task below.</div>`;
 html+=renderPlan()+renderReleasePath(params);
 html+=`<details class="section-caption"><summary>How progress is recorded</summary><p style="margin-top:12px">${E(D.roadmap.summary)}</p></details>`;
 html+=`<div class="toolbar" aria-label="Filter milestones">${[['all','All milestones'],...Object.entries(LABELS)].map(([s,l])=>`<a class="filter ${filter===s?'active':''}" href="${route('roadmap',{status:s})}">${E(l)}</a>`).join('')}</div><p class="section-caption">${items.length} milestones shown. Green segments count completed tasks; amber segments identify tasks awaiting review. These are task counts, not an estimate of release readiness.</p>`;
 if(!items.length)html+='<div class="empty">No milestones in this state.</div>';
 for(const phase of phases)html+=`<section class="roadmap-phase"><h2 class="phase-title">${E(phase)}</h2><div class="roadmap-grid">${items.filter(m=>m.phase===phase).map(m=>{const tasks=m.tasks||[],s=counts(tasks),n=tasks.length||1;return `<article class="milestone" data-roadmap-id="${E(m.id)}"><div class="milestone-top">${idTag(m.id)}${chip(m.status)}</div><h3>${E(m.title)}</h3><p>${E(m.summary)}</p>${m.absorbed_into?`<p class="absorbed-line">Open work moved to <a href="${route('roadmap',{milestone:m.absorbed_into})}">${E(m.absorbed_into)} ↗</a></p>`:''}<div class="progress-track" aria-label="${s.complete} completed tasks and ${s.needs_review} pending reviews"><span style="width:${s.complete/n*100}%"></span><span class="review" style="width:${s.needs_review/n*100}%"></span></div><small>${s.complete} / ${tasks.length} tasks complete${s.needs_review?' · '+s.needs_review+' await review':''}</small><a class="button" href="${route('roadmap',{milestone:m.id})}">Tasks & evidence <span>↗</span></a></article>`}).join('')}</div></section>`;
 html+=`<section id="release-gates" class="section-gap"><div class="panel-heading"><h2>Review and release gates</h2><span class="tag">${D.roadmap.gates.filter(g=>g.status!=='complete').length} open</span></div><div class="gates-grid">${D.roadmap.gates.map(g=>`<article id="gate-${E(g.id)}" data-roadmap-id="${E(g.id)}" class="panel ${params.get('gate')===g.id?'gate-selected':''}"><div class="milestone-top">${idTag(g.id)}${chip(g.status)}</div><h3 style="margin-top:14px">${E(g.title)}</h3><p class="section-caption">${E(g.summary)}</p>${evidence(g.evidence)}</article>`).join('')}</div></section>`;
 return html;
}
function snippet(d,q){if(!q)return '';const i=d.content.toLowerCase().indexOf(q.toLowerCase());if(i<0)return '';const s=short(d.content.slice(Math.max(0,i-45),i+q.length+105)).replace(/\s+/g,' ');return E(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`)}
function renderLibrary(params){
 const q=params.get('q')||'',category=params.get('category')||'all',path=params.get('doc');const selected=DOCS.get(path);const words=q.toLowerCase().split(/\s+/).filter(Boolean);
 const idQuery=q.trim().toUpperCase();const hits=q?[...IDS.entries()].filter(([id,x])=>id===idQuery||words.every(w=>(id+' '+x.item.title).toLowerCase().includes(w))).sort((a,b)=>(b[0]===idQuery)-(a[0]===idQuery)).slice(0,8):[];
 const docs=D.documents.filter(d=>(category==='all'||d.category===category)&&words.every(w=>(d.title+' '+d.path+' '+d.content).toLowerCase().includes(w))).sort((a,b)=>(b.title.toLowerCase().includes(q.toLowerCase())?1:0)-(a.title.toLowerCase().includes(q.toLowerCase())?1:0)||a.title.localeCompare(b.title));
 let html=headline('Knowledge base','All the docs. One place.','Read complete specifications, pass reports, decisions, context, and game data. Search matches full document contents.',`<span class="tag">${docs.length} / ${D.documents.length} documents</span>`);
 html+=`<div class="library-layout"><aside class="library-list" aria-label="Document list"><div class="library-tools"><select id="category" aria-label="Filter document category"><option value="all">All categories</option>${[...new Set(D.documents.map(d=>d.category))].sort().map(c=>`<option ${c===category?'selected':''}>${E(c)}</option>`).join('')}</select></div>${hits.length?`<div class="roadmap-hits"><div class="eyebrow">Roadmap IDs</div>${hits.map(([id,x])=>`<a class="roadmap-hit" href="${route('roadmap',{id})}"><code>${E(id)}</code> ${E(x.item.title)}<small>${E(x.kind)}${x.parent?' in '+E(x.parent.id):''} · ${E(LABELS[x.item.status]||x.item.status)}</small></a>`).join('')}</div>`:''}${docs.length?docs.map(d=>`<a class="doc-item" href="${route('library',{doc:d.path,...(q?{q}:{}),...(category!=='all'?{category}:{})})}" ${d.path===path?'aria-current="page"':''}><strong>${E(d.title)}</strong><small>${E(d.category)} · ${E(d.path)}</small>${q?`<div class="snippet">${snippet(d,q)}</div>`:''}</a>`).join(''):'<div class="empty">No matching documents. Try a shorter query or another category.</div>'}</aside><section class="reader" aria-label="Document reader">`;
 if(selected){const rendered=markdown(selected);html+=`<div class="reader-head"><div class="eyebrow">${E(selected.category)}</div><h2>${E(selected.title)}</h2><div class="reader-path">${E(selected.path)} · source edited ${date(selected.modified)}</div><div class="reader-actions"><button class="button" data-action="source">${raw?'Read document':'View source'}</button><button class="button" data-action="download">Download source</button><button class="button" data-action="copy">Copy link</button><button class="button" data-action="print">Print</button></div><p class="reader-notice">This is the complete source document. Its recorded status may predate the latest project handoff.</p></div><div class="reader-body"><article class="document">${raw?`<pre class="raw-source">${E(selected.content)}</pre>`:rendered}</article><nav class="toc" aria-label="Document contents"><div class="eyebrow">On this page</div>${tocItems.map(h=>`<a href="${route('library',{doc:selected.path,heading:h.id})}" style="padding-left:${(h.depth-1)*5}px">${E(h.text)}</a>`).join('')}</nav></div>`}
 else html+=`<div class="library-welcome"><div class="eyebrow">Start with the authoritative sources</div><h2 class="section-gap">Choose a document.<br>Follow the evidence.</h2><p class="muted">The library preserves the original documents in full, including older notes. Current milestones point to their evidence so you can see how the project arrived here.</p><div class="quick-docs">${['.wolf/STATUS.md','docs/PRODUCTION_SPEC.md','docs/EXPANSION_SPEC.md','docs/design/art_pass/steps/12-final-validation-result.md','docs/OPEN_QUESTIONS.md'].filter(p=>DOCS.has(p)).map(p=>documentLink(p)).join('')}</div></div>`;
 return html+'</section></div>';
}
function renderGallery(params){const group=params.get('group')||'all';const q=(params.get('q')||'').toLowerCase();const images=D.media.filter(m=>(group==='all'||m.group===group)&&(!q||(m.title+' '+m.path).toLowerCase().includes(q)));return headline('Look development','The visual record.','Rendered views, construction diagrams, material studies, and the existing store assets. Filenames and source folders identify their provenance.',`<span class="tag">${images.length} images</span>`)+`<div class="toolbar"><label for="gallery-group">Source folder</label><select id="gallery-group"><option value="all">All folders</option>${[...new Set(D.media.map(m=>m.group))].sort().map(g=>`<option ${group===g?'selected':''}>${E(g)}</option>`).join('')}</select></div>`+(images.length?`<div class="gallery">${images.map(m=>`<button class="image-card" data-image="${E(m.path)}"><img src="${E(m.url)}" alt="${E(m.title)}" loading="lazy"><span class="image-caption"><strong>${E(m.title)}</strong><small>${E(m.path)}</small></span></button>`).join('')}</div>`:'<div class="empty">No images match this folder or query.</div>')}
function renderActivity(){return headline('Project record','Every pass leaves a trace.','Source-file dates and Git checkpoints provide context. They are not claims that a test or playthrough was repeated.')+`<div class="grid-two"><section class="panel"><div class="panel-heading"><h2>Recent documented passes</h2><span class="tag">${recentDocs().length} reports</span></div>${recentDocs().map(d=>`<a class="document-row" href="${docRoute(d.path)}"><strong>${E(d.title)}</strong><small>Source edited ${date(d.modified)} · ${E(d.path)}</small></a>`).join('')}</section><div><section class="panel"><div class="panel-heading"><h2>Git checkpoints</h2><span class="tag">${E(D.repository.head)}</span></div><ul class="activity-list">${D.repository.commits.map(c=>`<li class="commit"><code>${E(c.hash)}</code><div><strong>${E(c.subject)}</strong><small>${date(c.date)}</small></div></li>`).join('')}</ul></section><section class="panel section-gap"><h2>Local working tree</h2><p class="section-caption">Uncommitted work is included in this dashboard snapshot.</p><pre class="change-list">${E(D.repository.changes.join('\n')||'Working tree clean')}</pre></section><section class="panel section-gap"><h2>Game inventory</h2><p class="section-caption">${D.inventory.systems.length} system scripts · ${D.inventory.resources} data resources · ${D.inventory.tests.length} test scripts discovered. Counts indicate files present, not passing tests.</p><details><summary>System scripts</summary><div class="inventory">${D.inventory.systems.map(E).join('<br>')}</div></details><details><summary>Test scripts</summary><div class="inventory">${D.inventory.tests.map(E).join('<br>')}</div></details><div class="toolbar">${documentLink('AGENTS.md','Architecture and workflow rules ↗')}</div></section></div></div>`}
function renderGraph(){const g=D.knowledge_graph||{available:false};const head=headline('Knowledge graph','Query the map, not the file list.','Code symbols, documents, and captures as nodes with explained edges, clustered into communities by graphify. The embedded view is fully offline.');if(!g.available)return head+`<div class="empty">No knowledge graph is present in this checkout yet.<br><br>Build one at the repository root (<code>graphify extract .</code> or the assistant's <code>/graphify</code>), then rebuild this dashboard.</div>`;return head+`<div class="toolbar"><span class="tag">${g.nodes} nodes</span><span class="tag">${g.edges} edges</span><span class="tag">${g.communities} communities</span><span class="tag">built ${date(g.built)}</span></div><iframe class="graph-frame" src="${E(g.url)}" title="Interactive knowledge graph"></iframe><p class="section-caption">Drag to arrange, scroll to zoom, click a node to inspect it. Auto-refresh pauses while this view is open so the layout survives; use Refresh snapshot to reload the graph.</p>`}
function render(){const params=current();const view=VIEWS[params.get('view')]?params.get('view'):'overview';document.getElementById('top-title').textContent=VIEWS[view];document.title='Hullwatch — '+VIEWS[view];document.querySelectorAll('.nav-item').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));const q=params.get('q')||'';if(document.activeElement!==document.getElementById('search'))document.getElementById('search').value=q;let html=view==='overview'?renderOverview(params):view==='roadmap'?renderRoadmap(params):view==='library'?renderLibrary(params):view==='gallery'?renderGallery(params):view==='graph'?renderGraph():renderActivity();html+=`<footer class="foot"><span>Hullwatch / Developer archive · snapshot ${E(new Date(D.generated_at).toLocaleString())}</span><span>${D.mode==='local'?'Local repository sources':'Exported repository snapshot'} · roadmap ${E(D.roadmap.updated)}</span></footer>`;document.getElementById('main').innerHTML=html;if(params.get('heading'))requestAnimationFrame(()=>document.getElementById(params.get('heading'))?.scrollIntoView({block:'start'}));else if(params.get('task'))requestAnimationFrame(()=>document.querySelector(`[data-roadmap-id="${CSS.escape(params.get('task'))}"]`)?.scrollIntoView({block:'center'}));else if(params.get('gate'))requestAnimationFrame(()=>document.getElementById('gate-'+params.get('gate'))?.scrollIntoView({block:'start'}));else if(params.get('stage'))requestAnimationFrame(()=>document.getElementById('stage-detail')?.scrollIntoView({block:'nearest'}));else if(params.get('gates'))requestAnimationFrame(()=>document.getElementById('release-gates')?.scrollIntoView({block:'start'}))}
document.getElementById('navigation').innerHTML=Object.entries(VIEWS).map(([v,title])=>`<a class="nav-item" href="${route(v)}" data-view="${v}"><svg viewBox="0 0 21 21" aria-hidden="true"><path d="${ICONS[v]}"/></svg>${{overview:'Overview',roadmap:'Roadmap',library:'Documentation',gallery:'Visual archive',activity:'History',graph:'Knowledge graph'}[v]}</a>`).join('');
document.getElementById('sidebar-stamp').textContent='Snapshot '+date(D.generated_at);
function refresh(){try{sessionStorage.setItem('hullwatch-scroll',JSON.stringify({hash:location.hash,y:scrollY}));sessionStorage.setItem('hullwatch-autorefresh',String(document.getElementById('auto-refresh').checked))}catch{}location.reload()}
document.getElementById('reload').addEventListener('click',refresh);
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();document.getElementById('main').focus()});
let lastInput=0;document.addEventListener('input',()=>lastInput=Date.now());
try{document.getElementById('auto-refresh').checked=sessionStorage.getItem('hullwatch-autorefresh')!=='false'}catch{}
setInterval(()=>{if(document.getElementById('auto-refresh').checked&&document.visibilityState==='visible'&&!document.getElementById('image-dialog').open&&current().get('view')!=='graph'&&Date.now()-lastInput>5000)refresh()},60000);
let searchTimer;document.getElementById('search').addEventListener('input',event=>{clearTimeout(searchTimer);const q=event.target.value;searchTimer=setTimeout(()=>{const p=current();const view=p.get('view')==='gallery'?'gallery':'library';location.hash=route(view,{q,...(view==='gallery'&&p.get('group')?{group:p.get('group')}:{})})},160)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('search').focus()} });
document.addEventListener('change',e=>{if(e.target.id==='category'){const p=current();location.hash=route('library',{category:e.target.value,...(p.get('q')?{q:p.get('q')}:{})})}if(e.target.id==='gallery-group'){const p=current();location.hash=route('gallery',{group:e.target.value,...(p.get('q')?{q:p.get('q')}:{})})}});
let toastTimer;function toast(text){const node=document.getElementById('toast');node.textContent=text;node.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.style.display='none',3500)}
document.addEventListener('click',async e=>{
 const copyId=e.target.closest('[data-copy-id]')?.dataset.copyId;if(copyId){e.preventDefault();try{await navigator.clipboard.writeText(copyId);toast('Copied '+copyId)}catch{toast('Roadmap ID: '+copyId)}return}
 const image=e.target.closest('[data-image]');if(image){e.preventDefault();const m=MEDIA.get(image.dataset.image);if(m){document.getElementById('image-title').textContent=m.title;document.getElementById('image-path').textContent=m.path;const full=document.getElementById('image-full');full.src=m.url;full.alt=m.title;document.getElementById('image-dialog').showModal()}return}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='close-image'){document.getElementById('image-dialog').close();return}
 if(action==='source'){raw=!raw;render();return}
 if(action==='print'){window.print();return}
 if(action==='copy'){try{await navigator.clipboard.writeText(location.href);toast('Document link copied')}catch{toast('Copy this document’s address from the browser bar')}return}
 if(action==='download'){const d=DOCS.get(current().get('doc'));if(!d)return;const url=URL.createObjectURL(new Blob([d.content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=d.path.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
});
document.getElementById('image-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
window.addEventListener('hashchange',()=>{raw=false;render()});render();
try{const saved=JSON.parse(sessionStorage.getItem('hullwatch-scroll')||'null');if(saved&&saved.hash===location.hash&&!current().get('heading'))requestAnimationFrame(()=>scrollTo(0,saved.y));sessionStorage.removeItem('hullwatch-scroll')}catch{}
</script>
</body>
</html>
